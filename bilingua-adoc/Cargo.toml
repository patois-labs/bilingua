[package]
name = "bilingua-adoc"
description = "Bilingua: AsciiDoc filter (adoc, asciidoc, asc)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
include.workspace = true
readme = "README.md"
keywords = ["localization", "translation", "l10n", "adoc", "parser"]
categories.workspace = true

[dependencies]
bilingua-model = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# the linearity tests count work (bilingua_model::work), which only counts with this feature
bilingua-model = { workspace = true, features = ["work-count"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { workspace = true }
