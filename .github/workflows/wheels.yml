# Build the Python wheels (Windows x64, Linux x86_64 manylinux_2_28) and the sdist, smoke-test each wheel, and keep
# them as workflow artifacts. Build only: nothing is uploaded to PyPI from here. The release runbook
# (cat-os docs/status/BILINGUA-RELEASE-RUNBOOK.md) downloads the artifacts and uploads them with twine.
# Active in the public patois-labs/bilingua repository, where bilingua/ is the root.
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x64
            manylinux: "off"
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bilingua-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Smoke test
        working-directory: bilingua-py
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist bilingua
          python -c "import bilingua; d = bilingua.extract('a.po', b'msgid \"Hello\"\nmsgstr \"\"\n', target_lang='es'); d['units'][0]['segments'][0]['target'] = [{'text': 'Hola'}]; out = bilingua.merge(d); assert b'Hola' in out, out; print(bilingua.version(), len(bilingua.formats()))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: bilingua-py/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bilingua-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bilingua-py/dist/*.tar.gz
