[package]
name = "bilingua-pdf"
description = "Bilingua: PDF text layer filter (extraction as Localization OS and PDFium read it)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bilingua-model = { workspace = true }
# Flate only, pure Rust (zlib-rs backend, Zlib licence), the same build the zip crate already uses.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
