[package]
name = "bilingua-properties"
description = "Bilingua: Java and Mozilla .properties parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
include.workspace = true
readme = "README.md"
keywords = ["localization", "translation", "l10n", "properties", "parser"]
categories.workspace = true

[dependencies]
bilingua-model = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# the linearity tests count work (bilingua_model::work), which only counts with this feature
bilingua-model = { workspace = true, features = ["work-count"] }
proptest = { workspace = true }
serde_json = { workspace = true }
