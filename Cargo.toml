[workspace]
members = ["bilingua-model", "bilingua-zip", "bilingua", "bilingua-seg", "bilingua-text", "bilingua-json", "bilingua-markdown", "bilingua-cli", "bilingua-docx", "bilingua-html", "bilingua-htmlcore", "bilingua-po", "bilingua-subtitle", "bilingua-xlsx", "bilingua-pptx", "bilingua-py", "bilingua-xliff", "bilingua-sdl", "bilingua-strings", "bilingua-toml", "bilingua-properties", "bilingua-resjson", "bilingua-json5", "bilingua-jsmodule", "bilingua-yaml", "bilingua-arb", "bilingua-resx", "bilingua-xaml", "bilingua-dtd", "bilingua-wxl", "bilingua-ftl", "bilingua-xcstrings", "bilingua-xmb", "bilingua-qtts", "bilingua-php", "bilingua-plist", "bilingua-xml", "bilingua-rc", "bilingua-mo", "bilingua-csv", "bilingua-xslt", "bilingua-desktop", "bilingua-epub", "bilingua-idml", "bilingua-odf", "bilingua-icml", "bilingua-mif", "bilingua-vsdx", "bilingua-xtg", "bilingua-adoc", "bilingua-mdx", "bilingua-latex", "bilingua-rst", "bilingua-email", "bilingua-ttx", "bilingua-serverpages", "bilingua-wordfast", "bilingua-xliffpkg", "bilingua-sdlproj", "bilingua-htmlhelp", "bilingua-image", "bilingua-stl", "bilingua-subtext", "bilingua-ass", "bilingua-ttml", "bilingua-wiki", "bilingua-scc", "bilingua-flare", "bilingua-pdf", "bilingua-dita", "oracle", "bilingua-ini", "bilingua-stf", "bilingua-dxf", "bilingua-xmlres"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/patois-labs/bilingua"
homepage = "https://github.com/patois-labs/bilingua"
rust-version = "1.88"
keywords = ["localization", "translation", "i18n", "l10n", "parser"]
categories = ["internationalization", "localization", "parser-implementations", "text-processing"]
# What a published .crate holds: the library source and its generated tables, the README, LICENSE and NOTICE.
# Tests, corpora, oracle data, WIRING.md notes, examples and the Python generator scripts stay in the repository.
include = ["/src/**", "/README.md", "/LICENSE", "/NOTICE"]

[workspace.dependencies]
bilingua-model = { path = "bilingua-model", version = "=0.9.0" }
bilingua-zip = { path = "bilingua-zip", version = "=0.9.0" }
bilingua-seg = { path = "bilingua-seg", version = "=0.9.0" }
