[workspace]
members = ["bilingua-model", "bilingua"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/patois-labs/bilingua"

[workspace.dependencies]
bilingua-model = { path = "bilingua-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.38"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
