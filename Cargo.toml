[workspace]
members = ["bilingua-model", "bilingua-zip", "bilingua", "bilingua-seg", "bilingua-text", "bilingua-json", "bilingua-markdown", "bilingua-cli", "bilingua-docx", "bilingua-html", "bilingua-po", "bilingua-subtitle", "bilingua-xlsx", "bilingua-pptx", "bilingua-py", "bilingua-xliff", "bilingua-sdl", "bilingua-yaml", "oracle"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/patois-labs/bilingua"

[workspace.dependencies]
bilingua-model = { path = "bilingua-model" }
bilingua-zip = { path = "bilingua-zip" }
bilingua-seg = { path = "bilingua-seg" }
bilingua-text = { path = "bilingua-text" }
bilingua-json = { path = "bilingua-json" }
bilingua-markdown = { path = "bilingua-markdown" }
bilingua-docx = { path = "bilingua-docx" }
bilingua-html = { path = "bilingua-html" }
bilingua-po = { path = "bilingua-po" }
bilingua-subtitle = { path = "bilingua-subtitle" }
bilingua-xlsx = { path = "bilingua-xlsx" }
bilingua-pptx = { path = "bilingua-pptx" }
bilingua = { path = "bilingua" }
bilingua-xliff = { path = "bilingua-xliff" }
bilingua-sdl = { path = "bilingua-sdl" }
bilingua-yaml = { path = "bilingua-yaml" }
regex = "1"
icu_segmenter = "2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.38"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
