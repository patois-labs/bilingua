[workspace]
members = ["bilingua-model", "bilingua-zip", "bilingua", "bilingua-seg", "bilingua-text", "bilingua-json", "bilingua-markdown", "bilingua-cli", "bilingua-docx", "bilingua-html", "bilingua-po", "bilingua-subtitle", "bilingua-xlsx", "bilingua-pptx", "bilingua-py", "bilingua-xliff", "bilingua-sdl", "bilingua-strings", "bilingua-toml", "bilingua-properties", "bilingua-resjson", "bilingua-json5", "bilingua-jsmodule", "bilingua-yaml", "bilingua-arb", "bilingua-resx", "bilingua-xaml", "bilingua-dtd", "bilingua-wxl", "bilingua-ftl", "bilingua-xcstrings", "bilingua-xmb", "bilingua-qtts", "bilingua-php", "bilingua-plist", "bilingua-xml", "bilingua-rc", "bilingua-mo", "bilingua-csv", "bilingua-xslt", "bilingua-desktop", "bilingua-epub", "bilingua-idml", "bilingua-odf", "bilingua-icml", "bilingua-mif", "bilingua-vsdx", "bilingua-xtg", "bilingua-adoc", "bilingua-mdx", "bilingua-latex", "bilingua-rst", "bilingua-email", "bilingua-ttx", "bilingua-serverpages", "bilingua-wordfast", "bilingua-xliffpkg", "bilingua-sdlproj", "bilingua-htmlhelp", "bilingua-image", "bilingua-stl", "bilingua-subtext", "bilingua-ass", "bilingua-ttml", "bilingua-wiki", "bilingua-scc", "bilingua-flare", "oracle", "bilingua-ini", "bilingua-stf", "bilingua-dxf"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/patois-labs/bilingua"

[workspace.dependencies]
bilingua-model = { path = "bilingua-model" }
bilingua-zip = { path = "bilingua-zip" }
bilingua-seg = { path = "bilingua-seg" }
bilingua-text = { path = "bilingua-text" }
bilingua-json = { path = "bilingua-json" }
bilingua-json5 = { path = "bilingua-json5" }
bilingua-markdown = { path = "bilingua-markdown" }
bilingua-docx = { path = "bilingua-docx" }
