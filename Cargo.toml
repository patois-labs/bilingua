bilingua-ttml = { path = "bilingua-ttml" }
bilingua-wiki = { path = "bilingua-wiki" }
bilingua-scc = { path = "bilingua-scc" }
bilingua-dxf = { path = "bilingua-dxf" }
bilingua-flare = { path = "bilingua-flare" }
regex = "1"
unicode-normalization = { version = "0.1", default-features = false }
encoding_rs = "0.8"
icu_segmenter = "2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.38"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
