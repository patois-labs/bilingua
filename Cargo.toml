bilingua-xlsx = { path = "bilingua-xlsx" }
bilingua-pptx = { path = "bilingua-pptx" }
bilingua = { path = "bilingua" }
bilingua-xliff = { path = "bilingua-xliff" }
bilingua-sdl = { path = "bilingua-sdl" }
bilingua-ini = { path = "bilingua-ini" }
bilingua-stf = { path = "bilingua-stf" }
bilingua-sdlproj = { path = "bilingua-sdlproj" }
bilingua-ass = { path = "bilingua-ass" }
bilingua-mo = { path = "bilingua-mo" }
bilingua-csv = { path = "bilingua-csv" }
bilingua-ftl = { path = "bilingua-ftl" }
bilingua-strings = { path = "bilingua-strings" }
bilingua-toml = { path = "bilingua-toml" }
bilingua-resjson = { path = "bilingua-resjson" }
bilingua-resx = { path = "bilingua-resx" }
bilingua-wxl = { path = "bilingua-wxl" }
bilingua-jsmodule = { path = "bilingua-jsmodule" }
bilingua-xcstrings = { path = "bilingua-xcstrings" }
bilingua-php = { path = "bilingua-php" }
bilingua-xml = { path = "bilingua-xml" }
bilingua-latex = { path = "bilingua-latex" }
bilingua-yaml = { path = "bilingua-yaml" }
bilingua-arb = { path = "bilingua-arb" }
bilingua-dtd = { path = "bilingua-dtd" }
bilingua-xmb = { path = "bilingua-xmb" }
bilingua-qtts = { path = "bilingua-qtts" }
bilingua-plist = { path = "bilingua-plist" }
bilingua-rc = { path = "bilingua-rc" }
bilingua-xslt = { path = "bilingua-xslt" }
bilingua-desktop = { path = "bilingua-desktop" }
bilingua-epub = { path = "bilingua-epub" }
bilingua-idml = { path = "bilingua-idml" }
bilingua-odf = { path = "bilingua-odf" }
bilingua-icml = { path = "bilingua-icml" }
