[package]
name = "bilingua-model"
description = "Bilingua: the extracted-document model shared by every Bilingua file parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
include.workspace = true
readme = "README.md"
keywords = ["localization", "translation", "l10n", "xliff", "segment"]
categories.workspace = true

[features]
# Counts scanning steps in `bilingua_model::work` for the linearity tests of the format crates (their
# dev-dependencies turn it on). Off in every release build, where `work::tick` compiles to nothing. Not semver API.
work-count = []

[dependencies]
encoding_rs = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
